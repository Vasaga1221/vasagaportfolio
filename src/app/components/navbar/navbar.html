<nav class="navbar" [class.scrolled]="scrolled()">
  <div class="container nav-inner">
    <a class="logo" (click)="scrollTo('#hero')">
      <span class="logo-bracket">&lt;</span>
      <span class="logo-text">Manivasagam</span>
      <span class="logo-bracket">/&gt;</span>
    </a>

    <ul class="nav-links" [class.open]="menuOpen()">
      @for (link of navLinks; track link.href) {
        <li>
          <a (click)="scrollTo(link.href)">{{ link.label }}</a>
        </li>
      }
      <li class="nav-cta">
        <a href="mailto:manivasagams@d-tools.com" class="btn-hire">Hire Me</a>
      </li>
    </ul>

    <button class="hamburger" [class.open]="menuOpen()" (click)="toggleMenu()" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</nav>

@if (menuOpen()) {
  <div class="overlay" (click)="closeMenu()"></div>
}
